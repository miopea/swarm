[project]
name = "swarm-ai"
version = "2026.8.6.13"
description = "A hive-mind for Claude Code agents — web orchestrator"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Brad Schleifer", email = "bschleifer@rcg.org" }
]
requires-python = ">=3.12"
keywords = ["claude", "ai", "agents", "pty", "orchestrator", "swarm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: aiohttp",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # Floors below are security floors, not feature floors — raising one
    # retires advisories that the CI pip-audit gate would otherwise have to
    # waive. Delete the matching lines from .github/pip-audit-waivers.txt in
    # the same commit as any bump here (task #1061).
    "click>=8.3.3,<9",  # PYSEC-2026-2132
    "pyyaml>=6.0,<7",
    "aiohttp>=3.14.1,<4",  # 21 advisories incl. PYSEC-2026-2094..2113, -237
    "aiohttp-jinja2>=1.6,<2",
    "jinja2>=3.1,<4",
    "extract-msg>=0.48,<1",
    "webauthn>=2.0,<3",
    "croniter>=2.0,<3",
    # Transitive (via webauthn), pinned directly ONLY to carry a security
    # floor: 48.0.1 clears GHSA-537c-gmf6-5ccf plus PYSEC-2026-35/36. Pinning
    # a transitive means we now own its upgrade cadence — done deliberately
    # here because these are runtime advisories in a package doing crypto.
    "cryptography>=48.0.1",
]

[project.urls]
Repository = "https://github.com/miopea/swarm"
Documentation = "https://github.com/miopea/swarm#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.1",
    "mypy>=1.0",
    # Pinned exactly: ruff's isort (I001) behavior drifts between minor
    # releases, so an unpinned local ruff gave false-green /check runs while
    # CI (which installs this same spec) rejected the imports. Keep in lockstep
    # with CI — bump both together.
    "ruff==0.15.20",
    # CI's "Security audit dependencies" step ran `uv run pip-audit` under
    # continue-on-error while pip-audit was declared nowhere — so it exited 2
    # with "Failed to spawn" and reported green on every run since it was
    # added, having never audited anything (task #1051). Declared here so the
    # step can actually run; known findings are waived, one deletable line
    # each, in .github/pip-audit-waivers.txt.
    "pip-audit>=2.7",
]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
python_classes = ["Test[A-Z]*"]
# CLAUDE.md: "ZERO_WARNINGS === REQUIRED → Any warning = failure".  Promote
# warnings to errors so that rule is enforced by the suite instead of relying
# on someone reading the summary — the four that were tolerated for months
# (two orphaned coroutines, aiohttp started-app mutation, a conftest notice)
# each masked a real defect.  Keep the ignore list narrow and justified.
filterwarnings = [
    "error",
    "ignore::aiohttp.web.NotAppKeyWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestCollectionWarning",
    "ignore::RuntimeWarning:collections",
]

# Coverage: enforce a floor so the suite catches regressions in the
# branches that have explicit tests.  Initial gate landed at 74 to
# match the pre-gap-fill baseline; lifted across three phases:
# 74 → 75 (refactor-adjacent fills: apply_llms 10%→100%,
# task_coordinator 66%→91%), 75 → 76 (storage layer: buzz_store
# 0%→99%, task_history 45%→100%; web routes: auth.py 13%→91%,
# login.py helpers 0%→31%).  Lift further as additional route
# coverage lands.
[tool.coverage.run]
source = ["src/swarm"]
branch = false  # branch coverage is noisy on aiohttp handler dispatch

[tool.coverage.report]
fail_under = 76
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
strict = false
warn_return_any = true
warn_unused_configs = true

# --- #1062: type-check gating -------------------------------------------
# mypy carries a backlog of ~450 errors across the modules listed below.
# Gating on the whole tree would red every run, so the CI step sat under
# continue-on-error and could never fail — a check reporting on something it
# was not measuring, the same defect class as #1051's pip-audit step.
#
# Strategy: silence the KNOWN-DIRTY modules explicitly, so mypy exits 0 and
# the CI step can genuinely GATE. Any module NOT on this list — every new
# file, and every one cleaned up and removed from here — fails CI on a new
# type error. 83 of 285 modules are listed; the other ~200 gate today.
#
# Why per-module and not a baseline: uv.lock is gitignored, so CI resolves
# dependency versions fresh and the error set drifts with them (450/82 here
# vs 442/77 in CI on the same commit). A line-or-message baseline captured
# locally would report phantom "new" errors in CI. Module granularity is
# coarse enough to be stable across that drift.
#
# KNOWN GAP, stated rather than hidden: a NEW error inside an
# already-listed module is not caught. Shrinking this list is the work —
# delete a module the moment it type-checks clean.
#
# MEASURED INSTANCE (#1201), so this stays concrete rather than theoretical.
# #1195 added a REQUIRED keyword-only argument to two spawn helpers. Deleting
# the resulting kwarg from a call site in `swarm.server.worker_service` (on
# this list) type-checked CLEAN — "Success: no issues found in 286 source
# files". The identical deletion in `swarm.queen.runtime` (NOT on this list)
# was caught: 'Missing named argument "write_identity"'. That pair is the
# discriminator — it shows the miss is the silencing, not a mypy limitation.
# The live daemon found it instead, as a 500 on worker creation.
#
# So: adding a required parameter across modules is exactly the change this
# list is worst at. When you make one, check the call sites by hand or add a
# test that exercises them unpatched (see tests/test_worker_service.py's
# "#1201" block) — do not rely on the type checker for a listed module.
# Un-silencing is the real fix but is not free: measured 2026-08-02,
# `swarm.server.worker_service` = 18 errors, `swarm.server.daemon` = 41.
[[tool.mypy.overrides]]
module = [
    "swarm.auth._oauth",
    "swarm.auth.graph",
    "swarm.auth.jira",
    "swarm.auth.passkeys",
    "swarm.auth.webauthn",
    "swarm.cli",
    "swarm.client",
    "swarm.config.loader",
    "swarm.config.serialization",
    "swarm.db.config_store",
    "swarm.db.core",
    "swarm.db.playbook_store",
    "swarm.db.proposal_store",
    "swarm.drones.decision_executor",
    "swarm.drones.directives",
    "swarm.drones.dreamer",
    "swarm.drones.idle_watcher",
    "swarm.drones.inter_worker_watcher",
    "swarm.drones.pilot",
    "swarm.drones.poll_dispatcher",
    "swarm.drones.pressure",
    "swarm.drones.state_tracker",
    "swarm.drones.store",
    "swarm.git.worktree",
    "swarm.hooks.install",
    "swarm.integrations.jira",
    "swarm.logging",
    "swarm.mcp.handlers._email",
    "swarm.mcp.queen_handlers._common",
    "swarm.mcp.queen_handlers._tasks",
    "swarm.mcp.queen_handlers._views",
    "swarm.mcp.server",
    "swarm.mcp.tools",
    "swarm.messages.store",
    "swarm.pipelines.engine",
    "swarm.pipelines.schedule",
    "swarm.pipelines.template",
    "swarm.providers",
    "swarm.providers.claude",
    "swarm.pty.bridge",
    "swarm.queen.queen",
    "swarm.queen.session",
    "swarm.server.analyzer",
    "swarm.server.api",
    "swarm.server.config_appliers.coordination",
    "swarm.server.config_appliers.drones",
    "swarm.server.config_appliers.llms",
    "swarm.server.config_appliers.notifications",
    "swarm.server.config_appliers.queen",
    "swarm.server.config_appliers.test",
    "swarm.server.config_appliers.workers",
    "swarm.server.config_manager",
    "swarm.server.daemon",
    "swarm.server.email_service",
    "swarm.server.helpers",
    "swarm.server.invariants",
    "swarm.server.loop_runner",
    "swarm.server.playbook_ops",
    "swarm.server.resource_monitor",
    "swarm.server.routes.attention",
    "swarm.server.routes.config",
    "swarm.server.routes.hooks",
    "swarm.server.routes.jira",
    "swarm.server.routes.pipelines",
    "swarm.server.routes.system",
    "swarm.server.routes.tasks",
    "swarm.server.routes.websocket",
    "swarm.server.routes.workers",
    "swarm.server.runner",
    "swarm.server.task_coordinator",
    "swarm.server.test_runner",
    "swarm.server.worker_service",
    "swarm.tasks.board",
    "swarm.tasks.cross_task",
    "swarm.tasks.task",
    "swarm.testing.project",
    "swarm.update",
    "swarm.web.app",
    "swarm.web.routes.login",
    "swarm.web.routes.proposals",
    "swarm.web.routes.pwa",
    "swarm.web.routes.tasks",
    "swarm.web.routes.workers",
]
ignore_errors = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "C901", "I", "UP", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings (❯ is intentional prompt char)
    "RUF002",  # ambiguous unicode in docstrings (❯, × are intentional)
    "RUF003",  # ambiguous unicode in comments (❯, × are intentional)
    "UP042",   # str+Enum → StrEnum (deferred — changes serialization behavior)
]

[tool.ruff.lint.mccabe]
# Default is 10; raised to 12 so HTTP handlers with 3-4 early-return
# guards + a try/except don't constantly trip the hook.  Code that
# wants to be simpler still will; this just removes the friction of
# having to refactor a handler every time one more branch lands.
# If cyclomatic complexity keeps climbing (hit 14-15 regularly), that's
# a code-smell signal worth acting on — but 10 was tighter than this
# codebase's conventional style.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059"]  # unused unpacked vars in test fixtures are intentional
# Importing a pytest fixture and then naming it as a test parameter is the
# standard way to share one, and ruff reads the parameter as redefining the
# import. Scoped to the one file that does it rather than blanketing tests/**.
"tests/test_worker_create_identity.py" = ["F811"]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
]
