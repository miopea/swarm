name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Run tests with coverage
        run: uv run pytest --cov=swarm --cov-report=term-missing --cov-fail-under=70 -q

      # GATING as of #1062. It was advisory under continue-on-error while ~450
      # errors across 83 modules made a whole-tree gate red every run — a step
      # that could not fail, i.e. reporting on something it was not measuring
      # (the same defect class as the pip-audit step below).
      #
      # Those 83 modules are now silenced explicitly in pyproject.toml's
      # [[tool.mypy.overrides]], so mypy exits 0 and this step gates for real.
      # Every module NOT on that list — every new file, and every one cleaned
      # up and deleted from it — fails CI on a new type error.
      #
      # Do NOT re-add continue-on-error. The reviewable way to accept a dirty
      # module is a line in that overrides list, which shows up in a diff;
      # continue-on-error hides everything at once. And do NOT pin an error
      # count in this step's name: uv.lock is gitignored, so CI resolves
      # dependency versions fresh and any count drifts with them.
      - name: Type check with mypy
        run: uv run mypy src/swarm/ --ignore-missing-imports

      # GATING. This step used to carry continue-on-error while pip-audit was
      # not a declared dependency, so it exited 2 with "Failed to spawn" and
      # reported green on every run without auditing anything (task #1051).
      # It now fails the build on any advisory that is not explicitly waived in
      # .github/pip-audit-waivers.txt. Do not re-add continue-on-error: the
      # correct way to accept a finding is a line in the waiver file, which is
      # reviewable in a diff.
      - name: Security audit dependencies
        run: |
          WAIVERS=$(grep -vE '^\s*(#|$)' .github/pip-audit-waivers.txt \
            | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          echo "Waiving $(grep -cE '^\s*(PYSEC|GHSA)' .github/pip-audit-waivers.txt) known advisories; failing on anything else."
          uv run pip-audit $WAIVERS
